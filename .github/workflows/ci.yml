name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vite 8 requires Node ^20.19.0 || >=22.12.0.
        node: ['20.19', '22.12', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: node --test scripts/test.cjs

      - name: Verify packed contents
        run: |
          node -e "
            const { execSync } = require('node:child_process');
            const pkg = require('./package.json');
            const packed = JSON.parse(execSync('npm pack --json --dry-run', { encoding: 'utf8' }));
            const files = new Set(packed[0].files.map(file => file.path));
            for (const required of [pkg.main, pkg.types, 'README.md', 'LICENSE']) {
              if (!files.has(required)) throw new Error('Missing from package: ' + required);
            }
            console.log('Package contents verified: ' + files.size + ' files');
          "
